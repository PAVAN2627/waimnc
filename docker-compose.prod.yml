services:
  # 1. Redis In-Memory Cache (Protects PostgreSQL against Hot-Key stampedes)
  redis:
    image: redis:7-alpine
    container_name: wmc-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    networks:
      - wmc_network

  # 2. NestJS Backend API
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: wmc-api
    restart: always
    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    networks:
      - wmc_network

  # 3. Nginx Reverse Proxy (Serves Web, Admin, Employee, API & Handles SSL)
  nginx:
    image: nginx:alpine
    container_name: wmc-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./apps/web/dist:/var/www/web:ro
      - ./apps/admin/dist:/var/www/admin:ro
      - ./apps/employee/dist:/var/www/employee:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - wmc_network

  # 4. Certbot for Automated SSL
  certbot:
    image: certbot/certbot
    container_name: wmc-certbot
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/www:/var/www/certbot:rw
      - ./deploy/certbot/conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  wmc_network:
    driver: bridge

volumes:
  redis_data:
    driver: local
