name: Render Keepalive Cron

on:
  schedule:
    # Runs every 10 minutes (cron syntax: minute hour day-of-month month day-of-week)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Render backend to keep instance awake..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://waimnc.onrender.com/api/health)
          echo "Render responded with HTTP status: $RESPONSE"
          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 404 ]; then
            echo "Render service is awake and reachable!"
          else
            echo "Unexpected status code: $RESPONSE"
          fi
