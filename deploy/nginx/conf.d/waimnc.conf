# Upstream NestJS Backend API
upstream api_backend {
    server api:3001;
    keepalive 32;
}

# 1. Main Citizen Portal — waimunicipalcouncil.org
server {
    listen 80;
    listen [::]:80;
    server_name waimunicipalcouncil.org www.waimunicipalcouncil.org;

    # Certbot ACME Challenge for SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS (uncomment once SSL is active)
    # location / {
    #     return 301 https://$host$request_uri;
    # }

    root /var/www/web;
    index index.html;

    # API Proxy
    location /api/ {
        proxy_pass http://api_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # SPA Routing (Redirect 404 to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }
}

